services:
  # Database service (MySQL)
  db:
    image: mysql:8.0
    container_name: perpustakaan-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - perpustakaan-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Laravel service (FrankenPHP)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: perpustakaan-backend
    restart: unless-stopped
    environment:
      APP_NAME: Perpustakaan
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SANCTUM_STATEFUL_DOMAINS: localhost:8080,localhost
      SESSION_DOMAIN: localhost
      FRONTEND_URL: http://localhost:8080
      LOG_CHANNEL: stderr
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - perpustakaan-net
    command: >
      sh -c "php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan octane:frankenphp --host=0.0.0.0 --port=8000"

  # Frontend Vue.js service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: perpustakaan-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - perpustakaan-net

networks:
  perpustakaan-net:
    driver: bridge

volumes:
  db_data:
    name: perpustakaan-db-data
